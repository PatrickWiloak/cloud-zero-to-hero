name: Structure and frontmatter validate

on:
  push:
    branches: [main]
    paths:
      - 'exams/**'
      - 'docs/certs.json'
      - 'README.md'
      - 'STUDY-HUB.md'
      - 'learn/**'
      - 'topics/**'
      - 'resources/**'
      - '**/*.md'
      - '.github/scripts/validate-cert-structure.sh'
      - '.github/scripts/validate-frontmatter.sh'
      - '.github/scripts/build-freshness-ledger.sh'
      - '.github/scripts/build-certs-index.py'
      - '.github/scripts/build-provider-indexes.py'
      - '.github/scripts/build-lab-map.py'
      - '.github/scripts/build-flashcards.py'
      - '.github/scripts/check-readme-counts.py'
      - '.github/scripts/check-code-fences.py'
      - '.github/scripts/check-internal-links.py'
      - '.github/scripts/check-repo-metadata.py'
      - '.github/scripts/balance-answer-positions.py'
  pull_request:
    paths:
      - 'exams/**'
      - 'docs/certs.json'
      - 'README.md'
      - 'STUDY-HUB.md'
      - 'learn/**'
      - 'topics/**'
      - 'resources/**'
      - '**/*.md'
      - '.github/scripts/validate-cert-structure.sh'
      - '.github/scripts/validate-frontmatter.sh'
      - '.github/scripts/build-freshness-ledger.sh'
      - '.github/scripts/build-certs-index.py'
      - '.github/scripts/build-provider-indexes.py'
      - '.github/scripts/build-lab-map.py'
      - '.github/scripts/build-flashcards.py'
      - '.github/scripts/check-readme-counts.py'
      - '.github/scripts/check-code-fences.py'
      - '.github/scripts/check-internal-links.py'
      - '.github/scripts/check-repo-metadata.py'
      - '.github/scripts/balance-answer-positions.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run structure validator
        run: bash .github/scripts/validate-cert-structure.sh

      - name: Run frontmatter validator
        run: bash .github/scripts/validate-frontmatter.sh

      # certs.json is the source of truth for every generated count and table.
      # If a cert was added, renamed, or had its fact-sheet edited without
      # regenerating, these fail with the command to run.
      - name: Check cert index is current
        run: python3 .github/scripts/build-certs-index.py --check

      - name: Check generated navigation is current
        run: python3 .github/scripts/build-provider-indexes.py --check

      - name: Check lab-to-cert map is current
        run: python3 .github/scripts/build-lab-map.py --check

      - name: Check flashcard decks are current
        run: python3 .github/scripts/build-flashcards.py --check

      # The README advertises counts that are not derived from certs.json -
      # concept pages, topic indexes, comparisons, word count. Those drifted
      # unnoticed (37 vs 46 concept pages) until this check existed.
      # Fix with: python3 .github/scripts/check-readme-counts.py --fix
      # A bank where one letter is correct for most questions can be passed by guessing
      # that letter (64 of 152 banks were like that until 2026-10-14). Fix with:
      # python3 .github/scripts/balance-answer-positions.py --write <file>
      - name: Check practice-question answer positions are balanced
        run: python3 .github/scripts/balance-answer-positions.py --check $(ls resources/practice-questions/*.md | grep -v -e README.md -e template.md)

      # Length is a tell too: after the 2026-10 rebalance the correct option was the
      # shortest in 38% of questions. Fix by rewording options (no script can).
      - name: Check practice-question option lengths carry no tell
        run: python3 .github/scripts/balance-answer-positions.py --check-length $(ls resources/practice-questions/*.md | grep -v -e README.md -e template.md)

      # An unclosed ``` / ~~~ fence swallows the rest of the page into a code block;
      # the site build only notices as missing anchors. This names file:line.
      - name: Check code fences are balanced
        run: |
          python3 .github/scripts/check-code-fences.py --self-test
          python3 .github/scripts/check-code-fences.py

      # Relative links must resolve to a file AND, when they carry a #fragment, to a
      # heading id the site build produces (same slug rules as mkdocs.yml). Offline,
      # so a broken anchor is reported without a full site build.
      - name: Check internal links and heading anchors
        run: |
          python3 .github/scripts/check-internal-links.py --self-test
          python3 .github/scripts/check-internal-links.py

      - name: Check README counts match the tree
        run: python3 .github/scripts/check-readme-counts.py --check

      # The description GitHub shows in search results and link previews is not a
      # file, so check-readme-counts.py could never see it. It sat at "122+ certs
      # across 22 providers, 37 plain-English concepts" while the tree was at
      # 148 / 27 / 53. Fix with --fix locally: the Actions token deliberately
      # cannot write repository settings, so CI only notices. Only the things a
      # command can fix block; the social preview, which has to be uploaded by
      # hand, prints as a NOTE so this can never be a red build nobody can clear.
      - name: Check GitHub repository metadata matches the tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check-repo-metadata.py --check

      # Advisory: reports which cert guides are due for re-verification this month.
      - name: Cert freshness rotation (advisory)
        continue-on-error: true
        run: python3 .github/scripts/check-cert-freshness.py

      # Advisory, never blocking. Orphan detection is a heuristic: some pages are
      # legitimately reachable only through a directory listing, so a hit is a prompt
      # to look, not a failure.
      - name: Report orphaned pages (advisory)
        continue-on-error: true
        run: bash .github/scripts/check-orphan-links.sh

      - name: Build freshness ledger (preview)
        run: bash .github/scripts/build-freshness-ledger.sh > /tmp/freshness.preview.md && head -40 /tmp/freshness.preview.md
